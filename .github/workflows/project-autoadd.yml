name: project-autoadd
on:
  issues:
    types: [opened, transferred, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  triage-and-route:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto-assign @Jadon-Fox
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: ['Jadon-Fox']
            });
        continue-on-error: true

      - name: Add to Project 6 (GLINT & bf16-to-int8)
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/Jadon-Fox/projects/6
          github-token: ${{ secrets.PROJECT_TOKEN }}
        continue-on-error: true

      - name: Add to Org Project (Fractal-Deployment)
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Fractal-Deployment/projects/4
          github-token: ${{ secrets.PROJECT_TOKEN }}
        continue-on-error: true
